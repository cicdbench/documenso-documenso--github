name: Continuous Integration
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cicdbench-github-r174
  cancel-in-progress: true
env:
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  build_app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/node-install
      - name: Copy env
        run: cp .env.example .env
      - name: Build app
        run: npm run build
  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          push: false
          context: .
          file: ./docker/Dockerfile
          tags: documenso-${{ github.sha }}
